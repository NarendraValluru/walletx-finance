spring.application.name=walletx-finance
server.port=8081
spring.main.web-application-type=servlet

spring.config.import=optional:file:./.local/service-client.properties,optional:file:./walletx-finance/.local/service-client.properties,optional:file:./.local/finance.properties,optional:file:./walletx-finance/.local/finance.properties
spring.datasource.url=${WALLETX_DB_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${WALLETX_DB_USERNAME:postgres}
spring.datasource.password=${WALLETX_DB_PASSWORD:${walletx.local.database-password:}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# No global schema. Future entities will declare @Table(schema = "...") explicitly.

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
server.error.include-message=never
server.error.include-stacktrace=never
spring.http.clients.connect-timeout=5s
spring.http.clients.read-timeout=15s

# Private credentials shared only by finance and auth. Separate from JWT signing.
walletx.introspection.client-id=${WALLETX_INTROSPECTION_CLIENT_ID:walletx-finance}
walletx.introspection.client-secret=${WALLETX_INTROSPECTION_CLIENT_SECRET:${walletx.local.introspection-client-secret:}}
walletx.introspection.uri=${WALLETX_INTROSPECTION_URI:http://localhost:8080/api/v1/internal/token/introspect}
walletx.introspection.connect-timeout=2s
walletx.introspection.read-timeout=3s
